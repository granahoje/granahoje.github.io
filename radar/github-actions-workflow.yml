name: 🤖 Radar Financeiro - Atualização Automática

on:
  schedule:
    # A cada 3 horas - 8 postagens por dia
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Permitir execução manual

jobs:
  update-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 🔄 Executar atualização completa
        run: |
          python radar/scripts/update_all.py

      - name: 🔐 Configurar Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Radar Bot"

      - name: 📤 Commit e Push
        run: |
          git add radar/data/products.json radar/feed.xml radar/sitemap.xml radar/cache/
          if git diff-index --quiet HEAD --; then
            echo "✅ Nenhuma alteração detectada"
          else
            git commit -m "🤖 Atualização automática - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: ✅ Sucesso
        run: |
          echo "✅ Radar Financeiro atualizado com sucesso!"
          echo "📊 Próxima atualização em 6 horas"

      - name: ❌ Erro
        if: failure()
        run: |
          echo "❌ Erro na atualização automática"
          exit 1
