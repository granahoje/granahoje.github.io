<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Juros Simples | Grana Hoje</title>
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .calc-container { max-width: 600px; margin: 60px auto; padding: 40px; background: #0f1b2d; border-radius: 25px; border: 1px solid rgba(34, 211, 189, 0.2); }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #a8b3c7; font-weight: 600; }
        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 1rem; }
        .result-box { margin-top: 30px; padding: 20px; background: rgba(34, 211, 189, 0.1); border-radius: 15px; text-align: center; display: none; }
        .result-value { font-size: 2rem; font-weight: 900; color: #22d3bd; display: block; }
        .btn-calc { width: 100%; padding: 15px; background: #22d3bd; color: #09111f; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(34, 211, 189, 0.2); }
    </style>
</head>
<body>
    <header style="background: rgba(15,23,42,.88); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.11); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
        <a href="/" style="text-decoration: none; font-size: 1.2rem; font-weight: 800; color: #22d3bd;">GRANA HOJE</a>
        <nav style="display: flex; gap: 20px;">
            <a href="/blog.html" style="color: #fff; text-decoration: none; font-weight: 700;">Blog</a>
            <a href="/about.html" style="color: #fff; text-decoration: none; font-weight: 700;">Sobre</a>
        </nav>
    </header>

    <main class="container">
        <div class="calc-container">
            <h1 style="text-align: center; margin-bottom: 30px; color: #22d3bd;">Calculadora de Juros Simples</h1>
            <div class="input-group">
                <label>Capital Inicial (R$)</label>
                <input type="number" id="capital" placeholder="Ex: 1000">
            </div>
            <div class="input-group">
                <label>Taxa de Juros (%)</label>
                <input type="number" id="taxa" placeholder="Ex: 1">
            </div>
            <div class="input-group">
                <label>Período (Meses)</label>
                <input type="number" id="tempo" placeholder="Ex: 12">
            </div>
            <button class="btn-calc" onclick="calcular()">Calcular Montante</button>

            <div class="result-box" id="resultBox">
                <p style="color: #a8b3c7;">O valor total ao final do período será:</p>
                <span class="result-value" id="totalValue">R$ 0,00</span>
                <p id="jurosValue" style="margin-top: 10px; font-size: 0.9rem; color: #22d3bd;"></p>
            </div>
        </div>
    </main>

    <script>
        function calcular() {
            const c = parseFloat(document.getElementById('capital').value);
            const i = parseFloat(document.getElementById('taxa').value) / 100;
            const t = parseFloat(document.getElementById('tempo').value);

            if (isNaN(c) || isNaN(i) || isNaN(t)) return;

            const juros = c * i * t;
            const montante = c + juros;

            document.getElementById('totalValue').innerText = montante.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('jurosValue').innerText = `Juros Totais: ${juros.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
