    <style>
        :root {
            --bg: #09111f;
            --card: rgba(15, 27, 45, 0.82);
            --text: #f8fafc;
            --muted: #a8b3c7;
            --primary: #22d3bd;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
        .container { width: min(100%, 900px); margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: var(--primary); }
        .page-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; background: linear-gradient(to right, var(--text), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 40px; }
        .calculator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 768px) { .calculator-grid { grid-template-columns: 1fr; } }
        .calculator-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .calculator-card h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text); font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text); border-radius: 10px; font-family: inherit; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); background: rgba(255,255,255,0.08); }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-calculate { background: var(--primary); color: var(--bg); width: 100%; }
        .btn-calculate:hover { transform: translateY(-2px); }
        .result-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 20px; border-radius: 15px; margin-top: 20px; display: none; }
        .result-box.show { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .result-value { color: var(--success); font-weight: 700; }
        .result-warning { color: var(--warning); font-weight: 700; }
        footer { margin-top: 60px; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; color: var(--muted); }

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">GRANA HOJE</a>
            <nav class="nav-links">
                <a href="/blog.html">Blog</a>
                <a href="/about.html">Sobre</a>
                <a href="/contact.html">Contato</a>
            </nav>
        </header>
        <main>
            <h1 class="page-title">Calculadora de Salário Líquido</h1>
            <p class="page-subtitle">Descubra quanto você realmente ganha após descontos</p>
            <div class="calculator-grid">
                <div class="calculator-card">
                    <h2>💰 Salário Líquido</h2>
                    <form id="salaryForm">
                        <div class="form-group">
                            <label for="grossSalary">Salário Bruto (R$)</label>
                            <input type="number" id="grossSalary" placeholder="3000" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="dependents">Número de Dependentes</label>
                            <input type="number" id="dependents" placeholder="0" min="0" max="10" step="1" value="0">
                        </div>
                        <div class="form-group">
                            <label for="state">Estado (para IR)</label>
                            <select id="state">
                                <option value="sp">São Paulo</option>
                                <option value="rj">Rio de Janeiro</option>
                                <option value="mg">Minas Gerais</option>
                                <option value="ba">Bahia</option>
                                <option value="other">Outro</option>
                            </select>
                        </div>
                        <button type="button" class="btn-calculate" onclick="calculateSalary()">Calcular</button>
                    </form>
                    <div class="result-box" id="salaryResult">
                        <div class="result-item">
                            <span>Salário Bruto:</span>
                            <span class="result-value" id="resultGross">R$ 0,00</span>
                        </div>
                        <div class="result-item">
                            <span>INSS (8%):</span>
                            <span class="result-warning" id="resultINSS">R$ 0,00</span>
                        </div>
                        <div class="result-item">
                            <span>Imposto de Renda:</span>
                            <span class="result-warning" id="resultIR">R$ 0,00</span>
                        </div>
                        <div class="result-item" style="border-bottom: 2px solid var(--primary); padding-top: 15px;">
                            <span style="font-weight: 800;">Salário Líquido:</span>
                            <span class="result-value" id="resultNet" style="font-size: 1.2rem;">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p>© 2026 Grana Hoje. Ferramenta educacional de finanças pessoais.</p>
        </footer>
    </div>
    <script>
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        }
        function calculateIR(grossSalary, dependents) {
            const inssDeduction = grossSalary * 0.08;
            const taxableIncome = grossSalary - inssDeduction - (dependents * 189.59);
            let ir = 0;
            if (taxableIncome > 4664) ir = (taxableIncome - 4664) * 0.27 + 705.86;
            else if (taxableIncome > 3751.05) ir = (taxableIncome - 3751.05) * 0.15 + 280.94;
            else if (taxableIncome > 2826.65) ir = (taxableIncome - 2826.65) * 0.075 + 142.80;
            else if (taxableIncome > 1903.98) ir = (taxableIncome - 1903.98) * 0.075;
            return Math.max(0, ir);
        }
        function calculateSalary() {
            const grossSalary = parseFloat(document.getElementById('grossSalary').value);
            const dependents = parseInt(document.getElementById('dependents').value) || 0;
            if (!grossSalary) { alert('Por favor, insira o salário bruto'); return; }
            const inss = grossSalary * 0.08;
            const ir = calculateIR(grossSalary, dependents);
            const netSalary = grossSalary - inss - ir;
            document.getElementById('resultGross').textContent = formatCurrency(grossSalary);
            document.getElementById('resultINSS').textContent = formatCurrency(inss);
            document.getElementById('resultIR').textContent = formatCurrency(ir);
            document.getElementById('resultNet').textContent = formatCurrency(netSalary);
            document.getElementById('salaryResult').classList.add('show');
        }
    </script>
</body>
