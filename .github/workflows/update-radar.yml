name: Atualizar Radar Financeiro

on:
  schedule:
    # Executar a cada 24 horas (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permitir execução manual

jobs:
  update-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests openai pillow

      - name: Gerar conteúdo com IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python radar/scripts/generate_content.py

      - name: Gerar imagens com IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python radar/scripts/generate_images.py

      - name: Atualizar sitemap
        run: |
          python radar/scripts/generate_sitemap.py

      - name: Commit e push das alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "🤖 Atualização automática de conteúdo - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Notificar sucesso
        if: success()
        run: |
          echo "✅ Atualização automática concluída com sucesso!"

      - name: Notificar erro
        if: failure()
        run: |
          echo "❌ Erro na atualização automática"
          exit 1
