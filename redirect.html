<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grana Hoje - Redirecionando...</title>
    <meta http-equiv="refresh" content="0; url=/pt-br/">
    <script>
        // Detectar idioma do navegador e redirecionar
        const userLanguage = (navigator.language || navigator.userLanguage).toLowerCase();
        let redirectPath = '/pt-br/'; // Padrão

        if (userLanguage.startsWith('pt-pt')) {
            redirectPath = '/pt-pt/';
        } else if (userLanguage.startsWith('es')) {
            redirectPath = '/es/';
        } else if (userLanguage.startsWith('en')) {
            redirectPath = '/en/';
        } else if (userLanguage.startsWith('fr')) {
            redirectPath = '/fr/';
        } else if (userLanguage.startsWith('zh')) {
            redirectPath = '/zh/';
        } else if (userLanguage.startsWith('hi')) {
            redirectPath = '/hi/';
        } else if (userLanguage.startsWith('ar')) {
            redirectPath = '/ar/';
        } else if (userLanguage.startsWith('bn')) {
            redirectPath = '/bn/';
        } else if (userLanguage.startsWith('ru')) {
            redirectPath = '/ru/';
        } else if (userLanguage.startsWith('ja')) {
            redirectPath = '/ja/';
        } else if (userLanguage.startsWith('pt')) {
            redirectPath = '/pt-br/';
        }

        // Redirecionar
        window.location.href = redirectPath;
    </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="237206" async data-cfasync="false"></script>
</head>
<body>
    <p>Redirecionando para seu idioma preferido...</p>
