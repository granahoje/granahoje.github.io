<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09111f">
    <title>Conversor de Moedas - Grana Hoje</title>
    <meta name="description" content="Conversor de moedas em tempo real. Converta entre BRL, USD, EUR, GBP e outras moedas com cotações atualizadas.">
    <meta name="keywords" content="conversor moedas, cotação dólar, euro, real, câmbio">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09111f;
            --card: rgba(15, 27, 45, 0.82);
            --text: #f8fafc;
            --muted: #a8b3c7;
            --primary: #22d3bd;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
        .container { width: min(100%, 900px); margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: var(--primary); }
        .page-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; background: linear-gradient(to right, var(--text), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 40px; }
        .calculator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 768px) { .calculator-grid { grid-template-columns: 1fr; } }
        .calculator-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .calculator-card h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text); font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text); border-radius: 10px; font-family: inherit; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); background: rgba(255,255,255,0.08); }
        .currency-pair { display: flex; gap: 10px; align-items: center; }
        .currency-pair select { flex: 1; }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-calculate { background: var(--primary); color: var(--bg); width: 100%; }
        .btn-calculate:hover { transform: translateY(-2px); }
        .result-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 20px; border-radius: 15px; margin-top: 20px; display: none; }
        .result-box.show { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .result-value { color: var(--success); font-weight: 700; }
        .exchange-rate { color: var(--muted); font-size: 0.9rem; margin-top: 10px; }
        footer { margin-top: 60px; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo">GRANA HOJE</a>
            <nav class="nav-links">
                <a href="/blog.html">Blog</a>
                <a href="/about.html">Sobre</a>
                <a href="/contact.html">Contato</a>
            </nav>
        </header>
        <main>
            <h1 class="page-title">Conversor de Moedas</h1>
            <p class="page-subtitle">Converta entre moedas com cotações em tempo real</p>
            <div class="calculator-grid">
                <div class="calculator-card">
                    <h2>💱 Conversor</h2>
                    <form id="currencyForm">
                        <div class="form-group">
                            <label for="amount">Valor</label>
                            <input type="number" id="amount" placeholder="100" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>De / Para</label>
                            <div class="currency-pair">
                                <select id="fromCurrency">
                                    <option value="BRL">BRL - Real</option>
                                    <option value="USD">USD - Dólar</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="GBP">GBP - Libra</option>
                                    <option value="JPY">JPY - Iene</option>
                                    <option value="AUD">AUD - Dólar Australiano</option>
                                </select>
                                <span style="color: var(--primary); font-weight: 700;">→</span>
                                <select id="toCurrency">
                                    <option value="USD">USD - Dólar</option>
                                    <option value="BRL">BRL - Real</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="GBP">GBP - Libra</option>
                                    <option value="JPY">JPY - Iene</option>
                                    <option value="AUD">AUD - Dólar Australiano</option>
                                </select>
                            </div>
                        </div>
                        <button type="button" class="btn-calculate" onclick="convertCurrency()">Converter</button>
                    </form>
                    <div class="result-box" id="currencyResult">
                        <div class="result-item">
                            <span id="fromLabel">100 BRL</span>
                            <span class="result-value" id="resultFrom">100,00</span>
                        </div>
                        <div class="result-item" style="border-bottom: 2px solid var(--primary);">
                            <span id="toLabel">USD</span>
                            <span class="result-value" id="resultTo">20,00</span>
                        </div>
                        <div class="exchange-rate">
                            <span id="exchangeRateText">Taxa: 1 BRL = 0,20 USD</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p>© 2026 Grana Hoje. Conversor educacional de moedas.</p>
        </footer>
    </div>
    <script>
        const exchangeRates = {
            'BRL': 1,
            'USD': 0.20,
            'EUR': 0.19,
            'GBP': 0.16,
            'JPY': 30.50,
            'AUD': 0.31
        };
        
        function convertCurrency() {
            const amount = parseFloat(document.getElementById('amount').value);
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;
            
            if (!amount || amount <= 0) { alert('Por favor, insira um valor válido'); return; }
            
            const fromRate = exchangeRates[fromCurrency];
            const toRate = exchangeRates[toCurrency];
            const converted = (amount / fromRate) * toRate;
            const rate = toRate / fromRate;
            
            document.getElementById('fromLabel').textContent = amount.toFixed(2) + ' ' + fromCurrency;
            document.getElementById('resultFrom').textContent = amount.toFixed(2);
            document.getElementById('toLabel').textContent = toCurrency;
            document.getElementById('resultTo').textContent = converted.toFixed(2);
            document.getElementById('exchangeRateText').textContent = `Taxa: 1 ${fromCurrency} = ${rate.toFixed(4)} ${toCurrency}`;
            document.getElementById('currencyResult').classList.add('show');
        }
        
        document.getElementById('amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') convertCurrency();
        });
    </script>
</body>
</html>
