    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d1b2;
            --primary-dark: #00b89c;
            --secondary: #7c3aed;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --accent: #f59e0b;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background Glows */
        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
        .glow-1 { top: -100px; right: -100px; }
        .glow-2 { bottom: -100px; left: -100px; background: var(--secondary); }
        
        header {
            background: var(--glass);
            backdrop-filter: blur(12px);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header h1 { 
            font-size: 1.5rem; 
            font-weight: 800; 
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .balance-card {
            background: linear-gradient(135deg, var(--card-bg), #0f172a);
            margin: 20px;
            padding: 28px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            pointer-events: none;
        }
        
        .balance-info p { 
            color: var(--text-light); 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        
        .balance-amount { 
            color: #fff; 
            font-size: 2.5rem; 
            font-weight: 800; 
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.3);
        }
        
        .withdraw-btn {
            background: var(--primary);
            color: #0f172a;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0, 209, 178, 0.2);
        }
        
        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 209, 178, 0.4);
            filter: brightness(1.1);
        }
        
        .ad-container {
            background: var(--glass);
            margin: 10px 20px;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-light);
            border: 1px solid var(--glass-border);
        }
        
        main { 
            padding: 0 20px 120px; 
            flex: 1; 
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .section-title { 
            margin: 30px 0 20px; 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .task-list { 
            display: grid; 
            gap: 16px; 
        }
        
        .task-item {
            background: var(--glass);
            padding: 20px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        
        .task-item:hover {
            transform: translateX(8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }
        
        .task-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-right: 18px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }
        
        .task-item:hover .task-icon {
            background: var(--primary);
            color: #0f172a;
            transform: rotate(-5deg) scale(1.1);
        }
        
        .task-details { flex: 1; }
        
        .task-name { 
            font-weight: 700; 
            font-size: 1.1rem; 
            margin-bottom: 4px; 
            color: #fff;
        }
        
        .task-reward { 
            color: var(--primary); 
            font-weight: 800; 
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .task-arrow { 
            color: var(--text-light); 
            font-size: 1.2rem; 
            opacity: 0.5;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 16px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            transition: all 0.3s;
        }
        
        .nav-item.active { color: var(--primary); }
        
        .nav-icon { 
            font-size: 1.4rem; 
            margin-bottom: 4px; 
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center; align-items: center;
            padding: 20px;
            backdrop-filter: blur(12px);
        }
        
        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .modal-title {
            color: #fff; 
            font-size: 1.6rem; 
            font-weight: 800; 
            margin-bottom: 16px; 
        }
        
        .modal-text { 
            line-height: 1.6; 
            color: var(--text-light); 
            margin-bottom: 30px; 
        }
        
        .btn-close {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .visitor-counter {
            text-align: center;
            padding: 30px 0;
            font-size: 0.8rem;
            color: var(--text-light);
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            margin-top: 20px;
        }

        .badge-live {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #ff4757;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .badge-hot {
            background: linear-gradient(to right, #ff4757, #ff6b81);
            color: white;
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 800;
            margin-left: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <header>
        <h1>GRANA HOJE</h1>
    </header>

    <div class="balance-card">
        <div class="balance-info">
            <p>Saldo Disponível</p>
            <div class="balance-amount">R$ <span id="balance">0,00</span></div>
        </div>
        <a href="#" class="withdraw-btn" onclick="showModal('Solicitar Saque', 'O limite mínimo para saque via PIX é de R$ 20,00. Continue completando as tarefas para liberar seu pagamento!')">SACAR AGORA</a>
    </div>

    <div class="ad-container">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4896859041377751" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <main>
        <h2 class="section-title">✨ Missões Lucrativas</h2>
        <div class="task-list">
            <!-- Visitar Site -->
            <div class="task-item" onclick="startTask(1.00, 'https://rendafacilbrasill.blogspot.com/?m=1')">
                <div class="task-icon">🌐</div>
                <div class="task-details">
                    <div class="task-name">Visitar Site <span class="badge-hot">NOVO</span></div>
                    <div class="task-reward">+ R$ 1,00 no saldo</div>
                </div>
                <div class="task-arrow">❯</div>
            </div>

            <!-- Signo da Sorte -->
            <div class="task-item" onclick="startTask(0.50, 'https://jessicagilrs100-blip.github.io/cosmicai.github.io/index.html')">
                <div class="task-icon">🔮</div>
                <div class="task-details">
                    <div class="task-name">Signo da Sorte</div>
                    <div class="task-reward">+ R$ 0,50 no saldo</div>
                </div>
                <div class="task-arrow">❯</div>
            </div>

            <!-- Responder Pesquisa -->
            <div class="task-item" onclick="startTask(1.50, 'https://financadescomplicado.blogspot.com/?m=1')">
                <div class="task-icon">📊</div>
                <div class="task-details">
                    <div class="task-name">Responder Pesquisa</div>
                    <div class="task-reward">+ R$ 1,50 no saldo</div>
                </div>
                <div class="task-arrow">❯</div>
            </div>

            <!-- Simulador de Prêmios -->
            <div class="task-item" onclick="startTask(2.00, 'https://jessicagilrs100-blip.github.io/cosmicai.github.io/index.html')">
                <div class="task-icon">💎</div>
                <div class="task-details">
                    <div class="task-name">Simulador de Prêmios</div>
                    <div class="task-reward">+ R$ 2,00 no saldo</div>
                </div>
                <div class="task-arrow">❯</div>
            </div>
        </div>

        <div class="visitor-counter">
            <span class="badge-live"></span>
            <span id="visitor-count">1.432</span> usuários online agora
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <div class="nav-icon">🏠</div>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="showModal('Minha Conta', 'Acesse seu perfil para ver o histórico de ganhos. (Em breve)')">
            <div class="nav-icon">👤</div>
            <span>Perfil</span>
        </a>
        <a href="#" class="nav-item" onclick="showModal('Suporte VIP', 'Fale com nossa equipe de suporte: suporte@granahoje.com')">
            <div class="nav-icon">💬</div>
            <span>Ajuda</span>
        </a>
    </nav>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" class="modal-title"></h3>
            <p id="modal-text" class="modal-text"></p>
            <button id="modal-btn" class="btn-close" onclick="closeModal()">FECHAR</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let timerInterval;

        function addBalance(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            localStorage.setItem('userBalance', balance);
        }

        function startTask(amount, url) {
            window.open(url, '_blank');
            
            let seconds = 30;
            showModal('Tarefa em Andamento', `Aguarde ${seconds} segundos navegando no site para receber sua recompensa...`);
            
            const modalBtn = document.getElementById('modal-btn');
            modalBtn.style.display = 'none';
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                seconds--;
                document.getElementById('modal-text').innerText = `Aguarde ${seconds} segundos navegando no site para receber sua recompensa...`;
                
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    addBalance(amount);
                    document.getElementById('modal-title').innerText = 'Tarefa Concluída!';
                    document.getElementById('modal-text').innerText = `Parabéns! R$ ${amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} foram adicionados ao seu saldo.`;
                    modalBtn.style.display = 'block';
                }
            }, 1000);
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-btn').style.display = 'block';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('modal').style.display = 'none';
        }

        window.onload = () => {
            const savedBalance = localStorage.getItem('userBalance');
            if (savedBalance) {
                balance = parseFloat(savedBalance);
                document.getElementById('balance').innerText = balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            }
            
            setInterval(() => {
                const count = Math.floor(Math.random() * (1500 - 1400 + 1)) + 1400;
                document.getElementById('visitor-count').innerText = count.toLocaleString('pt-BR');
            }, 4000);
        };

        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) {
                const modalBtn = document.getElementById('modal-btn');
                if (modalBtn.style.display !== 'none') {
                    closeModal();
                }
            }
        }
    </script>
</body>
</html>
