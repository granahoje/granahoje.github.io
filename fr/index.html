    <style>
        :root {
            --primary: #00d1b2;
            --primary-dark: #00b89c;
            --secondary: #7c3aed;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --accent: #f59e0b;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background Glows */
        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
        .glow-1 { top: -100px; right: -100px; }
        .glow-2 { bottom: -100px; left: -100px; background: var(--secondary); }
        
        header {
            background: var(--glass);
            backdrop-filter: blur(12px);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 { 
            font-size: 1.5rem; 
            font-weight: 800; 
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }

        .language-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .language-selector:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary);
        }
        
        .balance-card {
            background: linear-gradient(135deg, var(--card-bg), #0f172a);
            margin: 20px;
            padding: 28px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            pointer-events: none;
        }
        
        .balance-info p { 
            color: var(--text-light); 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        
        .balance-amount { 
            color: #fff; 
            font-size: 2.5rem; 
            font-weight: 800; 
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.3);
        }
        
        .withdraw-btn {
            background: var(--primary);
            color: #0f172a;
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0, 209, 178, 0.2);
            border: none;
            cursor: pointer;
        }
        
        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 209, 178, 0.4);
            filter: brightness(1.1);
        }
        
        .ad-container {
            background: var(--glass);
            margin: 10px 20px;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-light);
            border: 1px solid var(--glass-border);
        }
        
        main { 
            padding: 0 20px 120px; 
            flex: 1; 
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .section-title { 
            margin: 30px 0 20px; 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .task-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .task-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,209,178,0.1), transparent);
            transition: left 0.5s;
        }
        
        .task-item:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(0, 209, 178, 0.15);
            transform: translateY(-2px);
        }
        
        .task-item:hover::before {
            left: 100%;
        }
        
        .task-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }
        
        .task-details {
            flex: 1;
        }
        
        .task-name {
            color: var(--text);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .badge-hot {
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .task-reward {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .task-arrow {
            color: var(--text-light);
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        
        .task-item:hover .task-arrow {
            color: var(--primary);
            transform: translateX(5px);
        }
        
        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 15px;
            background: rgba(0, 209, 178, 0.1);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .badge-live {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 99;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            transition: all 0.3s;
            padding: 10px;
            flex: 1;
            text-align: center;
        }
        
        .nav-item.active,
        .nav-item:hover {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 1.5rem;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--glass-border);
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-title {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
        
        .modal-text {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .btn-close {
            background: var(--primary);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-close:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
    </style>
</head>

        let currentLanguage = 'pt-br';
        let balance = 0;

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            updatePageLanguage();
            window.location.href = window.location.origin + "/" + lang + "/";
        }

        function updatePageLanguage() {
            const t = translations[currentLanguage];
            if (!t) return;

            document.getElementById('balanceLabel').textContent = t.balanceLabel;
            document.getElementById('withdrawBtn').textContent = t.withdrawBtn;
            document.getElementById('tasksTitle').textContent = t.tasksTitle;
            document.getElementById('visitSiteName').textContent = t.visitSiteName;
            document.getElementById('visitSiteReward').textContent = t.visitSiteReward;
            document.getElementById('newBadge').textContent = t.newBadge;
            document.getElementById('zodSignName').textContent = t.zodSignName;
            document.getElementById('zodSignReward').textContent = t.zodSignReward;
            document.getElementById('surveyName').textContent = t.surveyName;
            document.getElementById('surveyReward').textContent = t.surveyReward;
            document.getElementById('simulatorName').textContent = t.simulatorName;
            document.getElementById('simulatorReward').textContent = t.simulatorReward;
            document.getElementById('counterSuffix').textContent = t.counterSuffix;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navProfile').textContent = t.navProfile;
            document.getElementById('navHelp').textContent = t.navHelp;
        }

        function showModal(titleKey, messageKey) {
            const t = translations[currentLanguage];
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').textContent = t[titleKey];
            document.getElementById('modal-text').textContent = t[messageKey].replace('{min_withdraw}', t.min_withdraw);
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function startTask(amount, url) {
            const t = translations[currentLanguage];
            showModal('taskInProgress', 'taskInProgressMessage');
            document.getElementById('modal-text').textContent = t.taskInProgressMessage.replace('{seconds}', '3');
            
            setTimeout(() => {
                balance += amount;
                document.getElementById('balanceAmount').textContent = `${translations[currentLanguage].currencySymbol} ${balance.toFixed(2).replace('.', ',')}`;
                closeModal();
                showModal('taskCompleted', 'taskCompletedMessage');
                document.getElementById('modal-text').textContent = t.taskCompletedMessage.replace('{amount}', `${t.currencySymbol} ${amount.toFixed(2).replace('.', ',')}`);
            }, 3000);
        }

        document.getElementById('languageSelector').addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        window.addEventListener('load', () => {
            const savedLanguage = localStorage.getItem('language') || 'pt-br';
            currentLanguage = savedLanguage;
            document.getElementById('languageSelector').value = savedLanguage;
            updatePageLanguage();
            window.location.href = window.location.origin + "/" + lang + "/";
        });

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('modal');
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
