<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grana Hoje - Redirecionando...</title>
    <meta http-equiv="refresh" content="0; url=/pt-br/">
    <script>
        // Detectar idioma do navegador e redirecionar
        const userLanguage = (navigator.language || navigator.userLanguage).toLowerCase();
        let redirectPath = '/pt-br/'; // Padrão

        if (userLanguage.startsWith('pt-pt')) {
            redirectPath = '/pt-pt/';
        } else if (userLanguage.startsWith('es')) {
            redirectPath = '/es/';
        } else if (userLanguage.startsWith('en')) {
            redirectPath = '/en/';
        } else if (userLanguage.startsWith('fr')) {
            redirectPath = '/fr/';
        } else if (userLanguage.startsWith('zh')) {
            redirectPath = '/zh/';
        } else if (userLanguage.startsWith('hi')) {
            redirectPath = '/hi/';
        } else if (userLanguage.startsWith('ar')) {
            redirectPath = '/ar/';
        } else if (userLanguage.startsWith('bn')) {
            redirectPath = '/bn/';
        } else if (userLanguage.startsWith('ru')) {
            redirectPath = '/ru/';
        } else if (userLanguage.startsWith('ja')) {
            redirectPath = '/ja/';
        } else if (userLanguage.startsWith('pt')) {
            redirectPath = '/pt-br/';
        }

        // Redirecionar
        window.location.href = redirectPath;
    </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="237206" async data-cfasync="false"></script>
</head>
<body>
    <p>Redirecionando para seu idioma preferido...</p>
    <p><a href="/pt-br/">Clique aqui se não for redirecionado automaticamente</a></p>

<!-- Botão Voltar ao Menu Inicial -->
<div style="text-align: center; margin: 30px 0; padding: 0 20px;">
    <a href="/" style="display: inline-block; background: linear-gradient(135deg, #00d1b2, #7c3aed); color: white; padding: 18px 32px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 1.2rem; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3); transition: all 0.3s ease; border: none; cursor: pointer; animation: pulse 2s infinite;">
        Voltar ao menu inicial e ganhe 20 reais agora
    </a>
</div>
<style>
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3); }
    50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(124, 58, 237, 0.5); }
    100% { transform: scale(1); box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3); }
}
</style>

</body>
</html>
